// This script will run when the page is loaded
window.onload = () => {
    let result = countWords();
    console.log(result);
};

function countWords() {
    // The text variable contains the long string of words
    let text = "JavaScript is easy and JavaScript is powerful.";

    // Remove periods and commas and convert to lowercase
    text = text.replace(/[.,]/g, "");
    text = text.toLowerCase();

    console.log(text);

    // Convert the text into an array of words
    const wordArray = text.split(/\s+/);

    console.log(wordArray);

    // Count each word
    const wordCount = {};

    wordArray.forEach((item) => {
        if (wordCount[item] == null) {
            wordCount[item] = 1;
        } else {
            wordCount[item] += 1;
        }
    });

    // Turn object into an array of arrays
    let myArray = Object.entries(wordCount);

    console.log(myArray);

    // Sort based on frequency (highest first)
    let bArray = myArray.sort(function (a, b) {
        return b[1] - a[1];
    });

    // Return the first three most common words
    bArray = bArray.slice(0, 3);

    return bArray;
}

// Don't change this line
if (typeof module !== "undefined") {
    module.exports = countWords;
}
